{% extends 'global/base.html' %}
{% load static %}

{% block header %}
  {% if request.resolver_match.view_name == 'sinal.list' and termo.t_imagem %}
    <div class="termo-header text-white text-center flex items-center justify-center mb-4" style="background-image: url('{{ termo.t_imagem.url }}');">
      <div class="overlay-glass w-full h-full flex items-center justify-center">
        <h2 class="font-extrabold text-3xl m-0">{{ termo.nome_termo }}</h2>
      </div>
    </div>
  {% else %}
    <section id="sobre" class="py-12 bg-primary text-white text-center shadow-sm">
      <div class="max-w-7xl mx-auto px-4">
        {% include 'catalog/partials/header.html' %}
      </div>
    </section>
  {% endif %}
{% endblock header %}
