{% load static %}
<footer class="border-t border-border mt-12 bg-surface py-8"
        role="contentinfo"
        aria-label="Rodapé">

  <div class="max-w-[1800px] mx-auto px-4 sm:px-6 lg:px-8">

    <div class="flex flex-col md:flex-row md:items-center gap-6">

      <!-- Left: Info -->
      <div class="flex-1 text-sm text-muted-foreground">
        <p>Sinalize</p>
        <p>© {% now "Y" %} Todos os direitos reservados.</p>
        <p class="mt-1 text-xs">Dicionário Visual de Libras para Turismo</p>
      </div>

      <!-- Right: IFC -->
      <a href="https://www.ifc.edu.br"
         target="_blank"
         rel="noopener noreferrer"
         class="hover:opacity-80 transition-opacity shrink-0"
         aria-label="Instituto Federal Catarinense">

        <img
          src="{% static 'img/Logo_IFC_horizontal_Camboriu.png' %}"
          alt="Instituto Federal Catarinense"
          width="144"
          height="48"
          class="h-12 object-contain aspect-[3/1]"
          loading="lazy"
          decoding="async">
      </a>

    </div>

  </div>

</footer>
