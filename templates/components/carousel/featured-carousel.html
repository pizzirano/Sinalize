<section id="featured" class="bg-surface rounded-2xl p-4 md:p-6" role="region" aria-roledescription="carousel" aria-label="Termos em destaque">
  <div class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold text-foreground">Destaques</h2>
      <span class="text-xs text-muted-foreground" x-data="{ current: 0, total: {{ termos_carrossel|length }} }" x-text="`${current + 1} / ${total}`"></span>
    </div>

    <div x-data="{ current: 0, total: {{ termos_carrossel|length }}, auto: null, start() { this.auto = setInterval(() => this.next(), 5000) }, stop() { clearInterval(this.auto) }, next() { this.current = (this.current + 1) % this.total }, prev() { this.current = (this.current - 1 + this.total) % this.total } }" x-init="start()" @mouseover="stop()" @mouseleave="start()" @keydown.window="if($event.key==='ArrowLeft') prev(); if($event.key==='ArrowRight') next();" class="relative">

      <!-- Carousel Slide Container (Fixed Height) -->
      <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-card to-background border border-border/50 shadow-lg" role="group" aria-roledescription="slides" style="height: 280px;">
        {% for termo in termos_carrossel %}
          <a href="{% url 'sinal_list' termo.id_termo %}" 
             :style="current === {{ forloop.counter0 }} ? 'opacity: 1; pointer-events: auto;' : 'opacity: 0; pointer-events: none; position: absolute; inset: 0;'"
             x-transition:enter="transition ease-in-out duration-300" 
             x-transition:leave="transition ease-in-out duration-300"
             :aria-hidden="current !== {{ forloop.counter0 }}" 
             class="absolute inset-0 p-6 md:p-8 flex items-center gap-6 hover:shadow-xl hover:border-primary/50 transition-all duration-300 cursor-pointer group"
             :class="current === {{ forloop.counter0 }} ? 'ring-2 ring-primary/30' : ''"
             aria-label="Ver sinais do termo {{ termo.nome_termo }}">
            
            <!-- Image Container -->
            <div class="flex-shrink-0 relative">
              <div class="absolute -inset-1 bg-gradient-to-br from-primary to-accent-cyan rounded-2xl opacity-0 group-hover:opacity-100 transition-opacity duration-300 blur-lg"></div>
              <img src="{{ termo.t_imagem.url }}" 
                   alt="{{ termo.nome_termo }}" 
                   class="relative h-32 w-32 md:h-40 md:w-40 rounded-2xl object-cover border-2 border-border/50 shadow-md group-hover:shadow-lg transition-all" 
                   loading="lazy">
            </div>
            
            <!-- Content Container -->
            <div class="flex-1 min-w-0">
              <h3 class="text-2xl md:text-3xl font-bold text-foreground group-hover:text-primary transition-colors truncate">{{ termo.nome_termo }}</h3>
              <div class="mt-4 flex items-center gap-2 text-primary text-sm font-medium opacity-0 group-hover:opacity-100 transition-opacity">
                <span>Ver sinais</span>
                <i class="fas fa-arrow-right text-xs"></i>
              </div>
            </div>
            
            <!-- Badge -->
            <div class="hidden md:flex flex-col items-center justify-center flex-shrink-0">
              <div class="text-4xl font-bold text-primary/20">{{ forloop.counter }}</div>
              <span class="text-xs text-muted-foreground mt-1">de {{ termos_carrossel|length }}</span>
            </div>
          </a>
        {% empty %}
          <div class="p-8 text-center text-muted-foreground min-h-[240px] flex items-center justify-center">Nenhum termo em destaque.</div>
        {% endfor %}
      </div>

      <!-- Controls -->
      <div class="mt-4 flex items-center justify-between gap-4">
        <!-- Navigation Buttons -->
        <div class="flex items-center gap-2">
          <button @click="prev()" 
                  aria-label="Anterior" 
                  class="px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 bg-background border border-border hover:border-primary hover:bg-primary/10 hover:text-primary focus-visible:ring-2 focus-visible:ring-ring active:scale-95">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button @click="next()" 
                  aria-label="Próximo" 
                  class="px-4 py-2 rounded-lg font-medium text-sm transition-all duration-200 bg-background border border-border hover:border-primary hover:bg-primary/10 hover:text-primary focus-visible:ring-2 focus-visible:ring-ring active:scale-95">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>

        <!-- Dot Indicators -->
        <div class="flex items-center gap-2" role="group" aria-label="Indicadores do carrossel">
          {% for termo in termos_carrossel %}
            <button @click="current = {{ forloop.counter0 }}" 
                    :aria-pressed="current === {{ forloop.counter0 }}" 
                    aria-label="Ir para slide {{ forloop.counter }}" 
                    class="w-2 h-2 rounded-full transition-all duration-300" 
                    :class="current === {{ forloop.counter0 }} ? 'bg-primary w-6' : 'bg-muted-foreground hover:bg-foreground/50'">
            </button>
          {% endfor %}
        </div>

        <!-- Play/Pause Info -->
        <div class="text-xs text-muted-foreground font-medium" x-text="'Clique para abrir'"></div>
      </div>
    </div>
  </div>
</section>
