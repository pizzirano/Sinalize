server {
    listen 80;
    server_name _;

    sendfile on;
    tcp_nopush on;

    location /media/ {
        alias /data/web/media/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
