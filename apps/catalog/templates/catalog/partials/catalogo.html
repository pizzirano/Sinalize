<div class="bg-card border border-border rounded-2xl p-6 transition-all hover:shadow-lg hover:border-primary focus-within:ring-2 focus-within:ring-ring">
    <div class="signal-title-container mb-3">
        <h2 class="text-foreground font-display font-bold text-xl">{{ termo.nome }}</h2>
    </div>

    <div class="signal-author flex flex-wrap gap-3 text-muted-foreground text-sm mb-4">
        <span class="signal-author-item inline-flex items-center gap-2">
            <i class="fas fa-user text-primary" aria-hidden="true"></i>
            <span>{{ termo.autor.nome }} {{ termo.autor.sobrenome }}</span>
        </span>

        <span class="signal-author-item inline-flex items-center gap-2">
            <i class="fas fa-calendar-alt text-primary" aria-hidden="true"></i>
            <span>{{ signal.created_at|date:"d/m/Y" }} às {{ signal.created_at|date:"H:i" }}</span>
        </span>

        <span class="signal-author-item inline-flex items-center gap-2">
            <a href="/catalog/dominio/{{ termo.dominio_id }}/categoria/{{ termo.categoria_id }}/" class="inline-flex items-center gap-2 text-muted-foreground hover:text-primary">
                <i class="fas fa-layer-group text-primary" aria-hidden="true"></i>
                <span>{{ termo.dominio_nome }}</span>
            </a>
        </span>
    </div>

    <div class="signal-content mb-4">
        <p class="text-foreground leading-relaxed">{{ termo.descricao }}</p>
    </div>

    <div class="signal-meta-container grid grid-cols-2 gap-4 mb-4 text-muted-foreground text-sm">
        <div class="signal-meta">
            <h3 class="signal-meta-title inline-flex items-center gap-2 font-semibold text-muted-foreground">
                <i class="fas fa-folder text-primary" aria-hidden="true"></i>
                <span>Categoria</span>
            </h3>
            <div class="signal-meta-text mt-1 text-foreground">
                {{ termo.categoria_nome }}
            </div>
        </div>

        <div class="signal-meta">
            <h3 class="signal-meta-title inline-flex items-center gap-2 font-semibold text-muted-foreground">
                <i class="fas fa-tag text-primary" aria-hidden="true"></i>
                <span>Subcategoria</span>
            </h3>
            <div class="signal-meta-text mt-1 text-foreground">
                {{ termo.subcategoria_nome }}
            </div>
        </div>
    </div>

    <div class="signal-footer card-footer">
        <a class="inline-flex items-center justify-center gap-2 w-full px-4 py-3 rounded-xl bg-primary text-primary-foreground hover:bg-primary/90 focus-visible:ring-2 focus-visible:ring-ring"
           href="" aria-label="Ver detalhes do termo {{ termo.nome }}">
            <i class="fas fa-eye text-primary" aria-hidden="true"></i>
            <span>ver mais...</span>
        </a>
    </div>
</div>
