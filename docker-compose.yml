services:
  projeto:
    build:
      context: .
      dockerfile: dockerfile
    container_name: sinalize-web
    restart: unless-stopped
    volumes:
      - ./:/Sinalize
      - /Sinalize/frontend/node_modules
      - ./data/web/static:/data/web/static/
      - ./data/web/media:/data/web/media/
    env_file:
      - ./dotenv_files/.env
    environment:
      - DEPLOY_MODE=prod
    depends_on:
      psql:
        condition: service_healthy
    networks:
      - app-network
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sinalize.rule=Host(`sinalize.nodx.uk`)"
      - "traefik.http.routers.sinalize.entrypoints=web"
      - "traefik.http.services.sinalize.loadbalancer.server.port=8000"

  psql:
    image: postgres:15-alpine
    container_name: sinalize-db
    restart: unless-stopped
    volumes:
      - ./data/postgres/data:/var/lib/postgresql/data/
    env_file:
      - ./dotenv_files/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  proxy-net:
    external: true
    name: proxy-net
